<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Choculaterie</title>
  <base href="/" />
  <!-- Tell the browser the preferred color-scheme BEFORE any CSS loads - prevents white flash -->
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- Apply saved theme before Angular boots to prevent flash -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme-preference');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = saved ? saved === 'dark' : prefersDark;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
  <!-- Match Material 3 magenta surface tokens exactly so the pre-Angular paint is seamless -->
  <style>
    html,
    body,
    app-root {
      margin: 0;
      background: #fffbff;
    }

    html[data-theme='dark'],
    html[data-theme='dark'] body,
    html[data-theme='dark'] app-root {
      background: #141218;
    }
  </style>
  <!-- Static OpenGraph tags - Angular's Meta service overrides these in live browsers for page-specific content. -->
  <meta property="og:site_name" content="Choculaterie" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Choculaterie - Minecraft Schematics" />
  <meta property="og:description" content="Browse, download and share Minecraft schematics on Choculaterie." />
  <meta property="og:url" content="https://choculaterie.com" />
  <meta property="og:image" content="https://choculaterie.com/server_logo.png" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
