@for (a of announcements(); track a.id) {
@let t = a.type.toLowerCase();
<div class="site-banner" [class]="'site-banner--' + t">
  <mat-icon [svgIcon]="t === 'info' ? 'mc:ui/info' : 'mc:ui/warning'"></mat-icon>
  <span>{{ a.message }}</span>
</div>
}
<app-navbar />
<app-title-spotlight />
<main class="content">
  <router-outlet />
</main>
<app-footer />
