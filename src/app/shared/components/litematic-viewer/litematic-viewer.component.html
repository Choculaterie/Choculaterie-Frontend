<div class="viewer-dialog">
    <div class="viewer-header">
        <button mat-icon-button (click)="downloadFile()" [matTooltip]="'Download ' + data.fileName">
            <img src="/icons/arrows/arrow_down.svg" alt="" aria-hidden="true" class="mc-icon" />
        </button>
        <h2>{{ data.fileName }}</h2>
        <button mat-icon-button mat-dialog-close>
            <img src="/icons/letters/X.svg" alt="" aria-hidden="true" class="mc-icon" />
        </button>
    </div>

    <div class="viewer-body">
        @if (loading()) {
        <div class="loading-overlay">
            <mat-progress-bar [mode]="loadingProgress() > 0 ? 'determinate' : 'indeterminate'"
                [value]="loadingProgress()" />
            <p>{{ loadingStatus() }}</p>
        </div>
        }

        @if (error()) {
        <div class="error-overlay">
            <img src="/icons/ui/warning.svg" alt="" aria-hidden="true" class="mc-icon" />
            <p>{{ error() }}</p>
        </div>
        }

        <canvas #viewerCanvas class="render-canvas" [class.hidden]="loading() || error()"></canvas>
    </div>

    @if (!loading() && !error() && maxY > 1) {
    <div class="viewer-controls">
        <div class="slider-group">
            <label i18n>Min Y: {{ currentMinY }}</label>
            <mat-slider [min]="minY" [max]="maxY" [step]="1" discrete>
                <input matSliderThumb [(ngModel)]="currentMinY" (valueChange)="onYRangeChange()" />
            </mat-slider>
        </div>
        <div class="slider-group">
            <label i18n>Max Y: {{ currentMaxY }}</label>
            <mat-slider [min]="minY" [max]="maxY" [step]="1" discrete>
                <input matSliderThumb [(ngModel)]="currentMaxY" (valueChange)="onYRangeChange()" />
            </mat-slider>
        </div>
    </div>
    }

    <div class="viewer-hint">
        @if (blockCountInfo()) {
        <span class="block-count-info">{{ blockCountInfo() }}</span>
        <span class="hint-sep"> · </span>
        }
        <span i18n>Drag to rotate · Middle-click drag to pan · Scroll to zoom · WASD to move</span>
    </div>
</div>
