<div class="skin-dialog">
    <button mat-icon-button class="close-btn" mat-dialog-close [matTooltip]="'Close' | t">
        <mat-icon svgIcon="mc:letters/X"></mat-icon>
    </button>

    <div class="skin-layout">
        <div class="canvas-wrap">
            @if (loading()) {
            <div class="overlay">
                <app-loading-spinner [diameter]="64" bare />
            </div>
            }
            @if (!loading() && error()) {
            <div class="overlay error-overlay">
                <mat-icon svgIcon="mc:ui/warning"></mat-icon>
                <p>{{ error() }}</p>
            </div>
            }
            <canvas #skinCanvas class="skin-canvas"></canvas>
        </div>

        <div class="skin-info">
            @if (playerName()) {
            <h2 class="player-name">{{ playerName() }}</h2>
            }
            <p class="hint">{{ 'Scroll to zoom · Drag to orbit' | t }}</p>

            <button mat-stroked-button (click)="toggleAnimation()" class="anim-btn" [disabled]="loading() || !!error()">
                @if (animating()) {
                <mat-icon svgIcon="mc:media/pause"></mat-icon>
                } @else {
                <mat-icon svgIcon="mc:arrows/tild_full_right_2"></mat-icon>
                }
                @if (animating()) { <span>{{ 'Pause' | t }}</span> } @else { <span>{{ 'Animate' | t }}</span> }
            </button>

            <div class="screenshot-btns">
                <button mat-stroked-button (click)="screenshotBody()" [matTooltip]="'Download 3D view' | t"
                    [disabled]="loading() || !!error()" class="screenshot-btn">
                    <mat-icon svgIcon="mc:ui/target"></mat-icon>
                    <span>{{ 'Screenshot' | t }}</span>
                </button>
                <div class="screenshot-row">
                    <button mat-stroked-button (click)="screenshotFace()" [matTooltip]="'Download face' | t"
                        [disabled]="loading() || !!error()">
                        <mat-icon svgIcon="mc:people/guy"></mat-icon>
                        <span>{{ 'Face' | t }}</span>
                    </button>
                    <button mat-stroked-button (click)="downloadSkin()" [matTooltip]="'Download skin file' | t"
                        [disabled]="loading() || !!error()">
                        <mat-icon svgIcon="mc:ui/download" matButtonIcon></mat-icon>
                        <span>{{ 'Skin' | t }}</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
